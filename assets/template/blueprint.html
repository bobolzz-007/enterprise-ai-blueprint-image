<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enterprise AI Blueprint</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#050b18;color:#eaf2ff}
.canvas{width:1920px;height:1080px;padding:18px 24px;background:radial-gradient(circle at 78% 8%,rgba(51,112,255,.12),transparent 27%),linear-gradient(135deg,#050b18,#081426)}
.top{height:64px;display:grid;grid-template-columns:210px 1fr 190px;align-items:center}
.title{font-size:32px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;grid-column:2}
.value-tags{grid-column:1;grid-row:1;display:flex;gap:7px;padding-left:8px}
.value-tag{width:31px;height:20px;border-radius:12px;color:#06101e;font-size:12px;font-weight:850;display:flex;align-items:center;justify-content:center}
.logo{grid-column:3;grid-row:1;justify-self:end;width:145px;height:auto;margin-right:6px}
.layout{height:960px;display:grid;grid-template-columns:1288px 390px 150px;gap:14px}
.region{height:960px;background:#0a1628;border:1px solid #254a73;border-radius:13px;overflow:hidden}
.region-title{height:42px;background:linear-gradient(90deg,#174ea6,#246bce);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:760}
.business{height:918px;padding:8px;display:grid;grid-template-rows:140px 205px 330px 222px;gap:7px}
.layer{display:grid;grid-template-columns:88px 1fr;border:1px solid #193754;border-radius:9px;overflow:hidden;background:#0b192d}
.rail{background:linear-gradient(180deg,#0a2444,#0a1b32);border-right:1px solid #254a73;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:18px;font-weight:760;text-align:center;line-height:1.25}
.rail-no{font-size:13px;color:#60a5fa;border:1px solid #3370ff;border-radius:10px;padding:1px 7px}.rail-icon{font-size:21px;color:#60a5fa}
.layer-body{padding:7px;display:grid;gap:7px}.strategy{grid-template-columns:1.35fr 1fr}.management{grid-template-columns:repeat(4,1fr)}.business-grid{grid-template-columns:repeat(5,1fr)}.frontline{grid-template-columns:repeat(4,1fr)}
.panel{min-width:0;background:#0f2038;border:1px solid #254a73;border-radius:8px;padding:7px;overflow:hidden}
.panel-head{height:25px;display:flex;align-items:center;gap:7px;font-size:16px;font-weight:760;white-space:nowrap}
.tag{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#06101e;font-size:13px;font-weight:850;flex:none}
.chips{display:grid;gap:5px;margin-top:5px}.strategy .chips{grid-template-columns:repeat(3,minmax(0,1fr))}.management .chips{grid-template-columns:repeat(2,minmax(0,1fr))}.business-grid .chips{grid-template-columns:1fr}.frontline .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
.capability{height:31px;border:1px solid #254a73;border-radius:6px;background:#11243d;display:flex;align-items:center;gap:6px;padding:0 7px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
.business-grid .capability{height:46px}.frontline .capability{height:37px}.cap-icon{color:#60a5fa;font-size:16px;flex:none}
.middle-body{height:918px;padding:8px;display:grid;grid-template-rows:430px 320px 148px;gap:6px}
.cap-group{border:1px solid #254a73;border-radius:9px;background:#0b192d;padding:7px;overflow:hidden}
.group-head{height:39px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #254a73;padding:0 2px 6px;margin-bottom:7px}
.group-name{font-size:16px;font-weight:800}.group-map{font-size:9px;color:#60a5fa;max-width:190px;text-align:right;line-height:1.25}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.product{height:56px;background:#11243d;border:1px solid #3370ff;border-radius:8px;display:flex;align-items:center;padding:6px;gap:8px;overflow:hidden}
.icon-wrap{width:36px;height:36px;flex:none;border-radius:8px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;padding:4px}.icon-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.product-name{font-size:13px;font-weight:750;white-space:nowrap}
.endpoints{height:918px;padding:12px 9px;display:flex;flex-direction:column;justify-content:space-between}
.endpoint{height:158px;border:1px solid #3370ff;border-radius:10px;background:#0f2038;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:750}
.device{font-size:36px;color:#60a5fa}.source-note{position:absolute;left:32px;bottom:3px;font-size:9px;color:#60748e}
</style>
</head>
<body>
<main class="canvas" data-must-visible="canvas">
  <header class="top">
    <div class="title"></div>
    <div class="value-tags"></div>
    <img class="logo" src="__ASSET_ROOT__feishu-logo-white.png" alt="飞书">
  </header>
  <section class="layout">
    <section class="region left-region" data-must-visible="left-region">
      <div class="region-title"></div>
      <div class="business"></div>
    </section>
    <section class="region middle-region" data-must-visible="middle-region">
      <div class="region-title">飞书 AI 协同整合层</div>
      <div class="middle-body"></div>
    </section>
    <section class="region endpoint-region" data-must-visible="endpoint-region">
      <div class="region-title">统一操作层</div>
      <div class="endpoints"></div>
    </section>
  </section>
</main>
<script>
const data=__BLUEPRINT_DATA__;
const middle=__MIDDLE_DATA__;
const assetRoot="__ASSET_ROOT__";
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iconFor=(i)=>["◎","▤","◇","↗","✓"][i%5];
document.querySelector(".title").textContent=`${data.companyName} X 飞书实现 AI 落地蓝图规划`;
document.querySelector(".region-title").textContent=`应用系统层（${data.companyShortName}核心业务矩阵）`;
document.querySelector(".value-tags").innerHTML=data.valueChain.map(v=>`<span class="value-tag" style="background:${esc(v.color)}">${esc(v.tag)}</span>`).join("");
const tagColor=Object.fromEntries(data.valueChain.map(v=>[v.tag,v.color]));
const layerSpec=[
  ["strategy","01","战略决策层","◎","strategy"],
  ["management","02","经营管理层","◴","management"],
  ["business","03","业务协同层","♙","business-grid"],
  ["frontline","04","一线与执行层","⌂","frontline"]
];
document.querySelector(".business").innerHTML=layerSpec.map(([key,no,name,icon,klass])=>`
  <section class="layer" data-validate-box="${key}" data-must-visible="${key}">
    <div class="rail"><span class="rail-icon">${icon}</span><span class="rail-no">${no}</span><span>${name.replace("层","<br>层")}</span></div>
    <div class="layer-body ${klass}">
      ${data.layers[key].map(panel=>`
        <article class="panel" data-validate-box="${esc(panel.title)}">
          <div class="panel-head">${panel.tag?`<span class="tag" style="background:${esc(tagColor[panel.tag]||"#60a5fa")}">${esc(panel.tag)}</span>`:""}${esc(panel.title)}</div>
          <div class="chips">${panel.items.map((item,i)=>`<div class="capability"><span class="cap-icon">${iconFor(i)}</span><span>${esc(item)}</span></div>`).join("")}</div>
        </article>`).join("")}
    </div>
  </section>`).join("");
const mapKey=["collaboration","businessAI","integration"];
document.querySelector(".middle-body").innerHTML=middle.groups.map((group,index)=>`
  <section class="cap-group" data-validate-box="middle-${index+1}" data-must-visible="middle-${index+1}">
    <header class="group-head"><span class="group-name">${index+1}｜${esc(group.name)}</span><span class="group-map">${esc(data.mappingLabels[mapKey[index]]||group.mapping)}</span></header>
    <div class="group-grid">${group.modules.map(module=>{
      const src=assetRoot+module.icon.replace(/^assets\//,"");
      return `<div class="product"><span class="icon-wrap"><img src="${esc(src)}" alt=""></span><span class="product-name">${esc(module.display_name)}</span></div>`;
    }).join("")}</div>
  </section>`).join("");
const devices=["▣","▯","◎","▯","⌘"];
document.querySelector(".endpoints").innerHTML=["PC端","移动端","网页端","iPad","H5"].map((name,i)=>`<div class="endpoint" data-must-visible="endpoint-${i+1}"><span class="device">${devices[i]}</span><span>${name}</span></div>`).join("");
</script>
</body>
</html>
